<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Search AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glass"></div>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    
    <button id="settings-btn" class="settings-btn" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </button>
    
    <button id="home-btn" class="home-btn" aria-label="Home" title="Return to Trending">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
    </button>

    <main class="container">
        <header>
            <div class="header-title-container">
                <h1>Power Search AI</h1>
            </div>
            <p>Next-gen AI powered search</p>
        </header>

        <section class="search-section">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Ask anything..." autocomplete="off">
                <button id="search-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
            
            <div class="chips-container">
                <button class="chip" data-modifier='exact'>🎯 Exact Phrase</button>
                <button class="chip" data-modifier='pdf'>📄 PDF Docs</button>
                <button class="chip" data-modifier='youtube'>📺 YouTube</button>
                <button class="chip" data-modifier='drive'>📁 Drive</button>
                <button class="chip" data-modifier='wiki'>🏛️ Wikipedia</button>
                <button class="chip" data-modifier='news'>📰 News</button>
                <button class="chip" data-modifier='academic'>🎓 Academic</button>
                <button class="chip" data-modifier='related'>🔗 Related Sites</button>
                <button class="chip" data-modifier='intitle'>📑 In Title Only</button>
                <button class="chip" data-modifier='before'>⏳ Before 2023</button>
            </div>
        </section>

        <section id="results-section" class="results-section hidden">
            <div id="loading-state" class="loading-state hidden">
                <div class="spinner"></div>
                <p>AI is browsing the web...</p>
            </div>
            
            <div id="search-results" class="search-results hidden">
                <div class="overview-header">
                    <div class="overview-title">
                        <span class="sparkle">🔍</span>
                        <h2>Search Results</h2>
                    </div>
                    <button id="share-btn" class="share-btn" title="Share this search" aria-label="Share">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                        Share
                    </button>
                </div>
                <!-- Dynamic Search Content (Links & Snippets) injected here -->
                <div id="search-content" class="search-content"></div>
            </div>
            
            <div id="error-state" class="error-state hidden">
                <p>Redirecting to standard search...</p>
            </div>
        </section>

        <!-- Trending Top 50 Section -->
        <section id="trending-section" class="trending-section">
            <div class="trending-header">
                <h2>🔥 Trending Searches</h2>
                <p>See what the AI is analyzing today</p>
            </div>
            <div id="trending-grid" class="trending-grid">
                <!-- Cards injected via JS -->
            </div>
        </section>

    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="close-settings-btn" class="close-btn">&times;</button>
            </div>
            
            <div class="settings-section">
                <h3>Theme</h3>
                <div class="theme-options">
                    <label class="radio-label">
                        <input type="radio" name="theme" value="auto" checked>
                        <span>Auto (System)</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="theme" value="light">
                        <span>Light</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="theme" value="dark">
                        <span>Dark</span>
                    </label>
                </div>
            </div>

            <div class="settings-section">
                <h3>Feature Manager <span class="subtitle">- Toggle Search Modifiers</span></h3>
                <div class="feature-toggles">
                    <label class="checkbox-label"><input type="checkbox" name="feature" value="exact" checked> <span>Exact Phrase</span></label>
                    <label class="checkbox-label"><input type="checkbox" name="feature" value="pdf" checked> <span>PDF Docs</span></label>
                    <label class="checkbox-label"><input type="checkbox" name="feature" value="youtube" checked> <span>YouTube</span></label>
                    <label class="checkbox-label"><input type="checkbox" name="feature" value="drive" checked> <span>Drive</span></label>
                    <label class="checkbox-label"><input type="checkbox" name="feature" value="wiki" checked> <span>Wikipedia</span></label>
                    <label class="checkbox-label"><input type="checkbox" name="feature" value="news" checked> <span>News</span></label>
                    <label class="checkbox-label"><input type="checkbox" name="feature" value="academic" checked> <span>Academic</span></label>
                    <label class="checkbox-label"><input type="checkbox" name="feature" value="related" checked> <span>Related Sites</span></label>
                    <label class="checkbox-label"><input type="checkbox" name="feature" value="intitle" checked> <span>In Title Only</span></label>
                    <label class="checkbox-label"><input type="checkbox" name="feature" value="before" checked> <span>Before 2023</span></label>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden">Link copied to clipboard!</div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
