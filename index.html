<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Search AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="search-container">
        <h1 class="glow-text">Power Search</h1>
        
        <div class="search-bar-wrapper">
            <input type="text" id="searchInput" placeholder="Search the web with AI...">
            <button id="searchBtn">Search</button>
        </div>

        <div class="quick-chips">
            <button class="chip" id="chipExact">🎯 Exact Phrase</button>
            <button class="chip" id="chipPDF">📄 PDF Docs</button>
            <button class="chip" id="chipReddit">👽 Reddit</button>
            <button class="chip" id="chipYT">📺 YouTube</button>
        </div>

        <div id="resultsContainer">
            </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
