<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Search UI Prototype</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="search-container">
        <h1 class="glow-text">Power Search</h1>
        
        <div class="search-bar-wrapper">
            <input type="text" id="searchInput" placeholder="What do you want to learn today?">
            <button id="searchBtn">Search</button>
        </div>

        <div class="quick-chips">
            <button class="chip" id="chipExact">🎯 Exact Phrase</button>
            <button class="chip" id="chipPDF">📄 PDF Docs</button>
            <button class="chip" id="chipReddit">👽 Reddit</button>
            <button class="chip" id="chipYT">📺 YouTube</button>
            <button class="chip" id="chip24h">🕒 Past 24h</button>
        </div>

        <div id="resultsContainer">
            <div class="result-item ai-box">
                <div class="result-title ai-title">✨ AI Summary</div>
                <div class="result-snippet">
                    This is a placeholder for the AI's answer. When the backend is connected, the smart summary of your search will appear right here...
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
